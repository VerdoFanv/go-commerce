apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "golang-be.fullname" . }}-api
  labels:
    {{- include "golang-be.labels" . | nindent 4 }}
    app: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "golang-be.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.port }}"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: {{ include "golang-be.image" (dict "Values" .Values "component" "api") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: APP_ENV
              value: {{ .Values.global.env | quote }}
            - name: DB_HOST
              value: {{ .Values.config.hostIP | quote }}
            - name: REDIS_ADDR
              value: {{ printf "%s:6379" .Values.config.hostIP | quote }}
            - name: KAFKA_BROKERS
              value: {{ printf "%s:9092" .Values.config.hostIP | quote }}
            - name: MONGO_URI
              value: {{ printf "mongodb://%s:27017" .Values.config.hostIP | quote }}
            - name: TYPESENSE_ADDR
              value: {{ printf "http://%s:8108" .Values.config.hostIP | quote }}
            - name: OTEL_ENABLED
              value: {{ .Values.config.otelEnabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "%s:4317" .Values.config.hostIP | quote }}
            - name: RATE_LIMIT_MAX
              value: {{ .Values.config.rateLimitMax | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
