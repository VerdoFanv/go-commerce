apiVersion: v1
kind: Service
metadata:
  name: {{ include "golang-be.fullname" . }}-api
  labels:
    {{- include "golang-be.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
