# Default values for the golang-be chart.

global:
  env: production

image:
  registry: ghcr.io
  repository: verdofanv/golang-be
  tag: latest
  pullPolicy: Always

api:
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4 # 4 physical cores total, shared with the Compose data tier
    targetCPUUtilization: 70

worker:
  replicaCount: 1 # single node — bump to 2 only to demo consumer-group rebalancing
  metricsPort: 2112
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 192Mi

# This cluster (k3s) runs only the stateless app tier. Postgres, Redis, Kafka,
# MongoDB, and Typesense stay on Docker Compose on the SAME physical host —
# set hostIP to that host's LAN IP (`hostname -I | awk '{print $1}'`).
config:
  hostIP: "HOST_IP"
  dbName: golang_be
  otelEnabled: false
  rateLimitMax: "100"

ingress:
  enabled: true
  className: traefik # built into k3s by default
  host: golang-be.local

# Secrets are NOT managed by this chart — use external-secrets/sealed-secrets.
existingSecret: golang-be-secret

serviceAccount:
  create: true
