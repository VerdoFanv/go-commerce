# NEVER commit real secrets. Template only — inject via sealed-secrets,
# external-secrets, or your cloud secret manager in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: golang-be-secret
  namespace: golang-be
type: Opaque
stringData:
  API_KEY: "dev-api-key"
  JWT_SECRET: "dev-secret-change-me"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  REDIS_PASSWORD: ""
  # Must match Typesense --api-key in docker-compose.yml
  TYPESENSE_API_KEY: "dev-typesense-key"
  # If Mongo requires auth, put credentials here (overrides ConfigMap MONGO_URI).
  # MONGO_URI: "mongodb://USER:PASS@HOST_IP:27017/?authSource=admin"
