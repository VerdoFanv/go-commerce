# NEVER commit real secrets. Copy to secret.yaml (gitignored) and fill from .env / vault.
# Runtime values come from environment (ConfigMap + Secret), not hardcoded in Go.
apiVersion: v1
kind: Secret
metadata:
  name: golang-be-secret
  namespace: golang-be
type: Opaque
stringData:
  API_KEY: "CHANGE_ME_API_KEY"
  JWT_SECRET: "CHANGE_ME_MIN_16_CHARS"
  DB_USER: "CHANGE_ME_DB_USER"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  REDIS_PASSWORD: ""
  # Must match Typesense --api-key (compose / TYPESENSE_API_KEY in .env)
  TYPESENSE_API_KEY: "CHANGE_ME_TYPESENSE_KEY"
  # If Mongo enforces auth, override ConfigMap MONGO_URI here:
  # MONGO_URI: "mongodb://USER:PASS@HOST_IP:27017/?authSource=admin"
