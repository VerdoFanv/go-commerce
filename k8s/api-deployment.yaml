apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: golang-be
  labels:
    app: api
    app.kubernetes.io/name: golang-be
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime rollouts
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          # Dev/single-node: prefer locally imported image (see README Option A).
          # Swap to ghcr.io/verdofanv/golang-be-api:latest + Always for CI pulls.
          image: golang-be-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: golang-be-config
            - secretRef:
                name: golang-be-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Probes map 1:1 to /health/live and /health/ready.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Let the LB deregister us before SIGTERM lands.
                command: ["sh", "-c", "sleep 5"]
