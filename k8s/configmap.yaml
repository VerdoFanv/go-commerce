apiVersion: v1
kind: ConfigMap
metadata:
  name: golang-be-config
  namespace: golang-be
data:
  # This cluster (k3s) runs only the stateless app tier. Postgres, Redis,
  # Kafka, MongoDB, and Typesense stay on Docker Compose on the SAME host —
  # replace HOST_IP with that host's LAN IP (`hostname -I | awk '{print $1}'`).
  # Pods reach host-published ports via the real interface, not 127.0.0.1.
  APP_ENV: "staging"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  DB_HOST: "HOST_IP"
  DB_PORT: "5432"
  DB_NAME: "golang_be"
  DB_SSLMODE: "disable"
  REDIS_ADDR: "HOST_IP:6379"
  KAFKA_BROKERS: "HOST_IP:9092"
  KAFKA_TOPIC_PRODUCTS: "products.events"
  KAFKA_TOPIC_DLQ: "products.events.dlq"
  KAFKA_GROUP_WORKER: "golang-be-worker"
  KAFKA_GROUP_NOTIFIER: "golang-be-notifier"
  # Unauthenticated URI — infra-db Mongo with --auth WILL break the worker
  # (createIndexes → Unauthorized). Always override from Secret:
  #   MONGO_URI: mongodb://USER:PASS@HOST_IP:27017/?authSource=admin
  MONGO_URI: "mongodb://HOST_IP:27017"
  MONGO_DB: "golang_be_audit"
  TYPESENSE_ADDR: "http://HOST_IP:8108"
  # Tracing is opt-in (matches the `observability` compose profile).
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "HOST_IP:4317"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "1m"
  REQUEST_TIMEOUT: "10s"
  SHUTDOWN_TIMEOUT: "15s"
  METRICS_PORT: "2112"
  # Lab host: staging keeps /lab + /docs. Use production only when exposing publicly.
  CORS_ORIGINS: "*"
  ENABLE_HSTS: "false"
  ORDER_HOLD_TTL: "15m"
  BCRYPT_COST: "12"
