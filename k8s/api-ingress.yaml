apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: golang-be
  annotations:
    # k3s ships Traefik by default — zero extra install for ingress on a single node.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: golang-be.local # add to /etc/hosts on your client machine -> node IP
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
