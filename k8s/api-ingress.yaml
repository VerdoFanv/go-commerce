apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: golang-be
  annotations:
    # k3s ships Traefik by default — zero extra install for ingress on a single node.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    # Hostname access (add `<node-ip> golang-be.local` to client /etc/hosts).
    - host: golang-be.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
    # Bare IP / LAN access: http://<node-ip>/...
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
