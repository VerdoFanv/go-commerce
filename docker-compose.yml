name: golang-be

services:
  # ---------- Data plane ----------
  # Kafka in KRaft mode — no Zookeeper needed.
  kafka:
    image: apache/kafka:3.9.0
    mem_limit: 768m
    cpus: 1.5
    ports:
      - "9092:9092"
    environment:
      # Default JVM heap is 1G — overkill for a single-broker dev setup on weak hardware.
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    mem_limit: 300m
    cpus: 0.5
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    command: "--data-dir /data --api-key=dev-typesense-dev"

  # ---------- Observability plane (opt-in: `docker compose --profile observability up -d`) ----------
  # Off by default — three extra JVM/Go processes the weak CPU doesn't need running 24/7.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    mem_limit: 256m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    mem_limit: 200m
    cpus: 0.5
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62
    profiles: ["observability"]
    mem_limit: 250m
    cpus: 0.5
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Third observability pillar: logs. Single-binary filesystem storage — no
  # object store needed for a one-node dev/portfolio deployment.
  loki:
    image: grafana/loki:3.3.0
    profiles: ["observability"]
    mem_limit: 200m
    cpus: 0.5
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  # Tails every container's logs via the Docker API — zero per-service config.
  promtail:
    image: grafana/promtail:3.3.0
    profiles: ["observability"]
    mem_limit: 128m
    cpus: 0.3
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ---------- Application plane ----------
  api:
    build:
      context: .
      target: api
    mem_limit: 150m
    cpus: 1.0
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      typesense:
        condition: service_healthy
    networks:
      - default
      - shared-net
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    mem_limit: 100m
    cpus: 0.5
    ports:
      - "2112:2112" # Prometheus metrics
    env_file:
      - .env
    environment:
      APP_ENV: development
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongodb:27017
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - default
      - shared-net
    restart: unless-stopped

volumes:
  kafka_data:
  typesense_data:
  grafana_data:
  loki_data:

networks:
  default:
  shared-net:
    external: true
