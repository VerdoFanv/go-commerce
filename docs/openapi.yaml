openapi: 3.0.3
info:
  title: Golang BE API
  description: |
    Production-grade event-driven REST API (Gin).

    Stack: PostgreSQL (SQL migrations), Redis, Kafka (+ DLQ), MongoDB audit,
    Typesense search, Prometheus, OpenTelemetry.

    Response envelope: `{ success, message, errorCode?, data, meta? }`.

    - `errorCode` — stable machine codes (e.g. `AUTH_TOKEN_EXPIRED`, `RESOURCE_NOT_FOUND`, `RESOURCE_CONFLICT`).
    - `meta` — cursor pagination for list endpoints.
    - `/api/v1` requires header `apikey` (or `X-API-Key`). Protected routes also need `Authorization: Bearer`.
    - `/lab/*` is admin-only and disabled when `APP_ENV=production`.
  version: 2.2.0
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Health
  - name: Authentication
  - name: Products
  - name: Wishlists
  - name: Orders
  - name: Lab
  - name: Realtime

# Health probes & /metrics intentionally sit OUTSIDE /api/v1 — load balancers,
# K8s kubelet, and Prometheus must reach them without credentials.
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe (is the process alive?)
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              example:
                success: true
                message: alive
                data:
                  status: up

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (critical deps must be up)
      description: |
        **Critical** (503 if down): `postgres`, `redis`.
        **Optional** (200 `degraded` if down): `mongo`, `typesense`.
        Optional failures keep the pod in the Service so CRUD/orders survive
        search/audit outages; search itself returns 503 via circuit breaker.
      security: []
      responses:
        "200":
          description: Ready or degraded (optional deps down)
          content:
            application/json:
              examples:
                ready:
                  value:
                    success: true
                    message: ready
                    data:
                      checks:
                        postgres: ok
                        redis: ok
                        mongo: ok
                        typesense: ok
                degraded:
                  value:
                    success: true
                    message: degraded
                    data:
                      mode: degraded
                      checks:
                        postgres: ok
                        redis: ok
                        mongo: "down: ..."
                        typesense: ok
        "503":
          description: Critical dependency down
          content:
            application/json:
              example:
                success: false
                message: service unavailable
                errorCode: SERVICE_UNAVAILABLE
                data:
                  mode: unavailable
                  checks:
                    postgres: ok
                    redis: "down: ..."

  /health:
    get:
      tags: [Health]
      summary: Alias of /health/ready
      security: []
      responses:
        "200":
          description: Same as /health/ready
        "503":
          $ref: "#/components/responses/Error"

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain: {}

  /api/v1/authentication/register:
    post:
      tags: [Authentication]
      summary: Register user
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/authentication/login:
    post:
      tags: [Authentication]
      summary: Login
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/authentication/refresh-token:
    post:
      tags: [Authentication]
      summary: Rotate tokens with a refresh token
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK — `data` is AuthTokens directly (not nested under `tokens`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: token refreshed }
                  data: { $ref: "#/components/schemas/AuthTokens" }
              example:
                success: true
                message: token refreshed
                data:
                  accessToken: eyJ...
                  refreshToken: eyJ...
        "401":
          description: Token invalid/expired — errorCode `AUTH_TOKEN_EXPIRED` when expired
          $ref: "#/components/responses/Error"

  /api/v1/authentication/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token (jti)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/authentication/me:
    get:
      tags: [Authentication]
      summary: Current authenticated user
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List my products (cursor-paginated)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from `meta.nextCursor` of the previous page. Omit for the first page.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK — `meta.nextCursor` continues the listing while `meta.hasMore` is true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListEnvelope"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Products]
      summary: Create product (publishes `product.created` to Kafka)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/products/catalog:
    get:
      tags: [Products]
      summary: Buyer marketplace catalog (all sellers, cursor-paginated)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/products/search:
    get:
      tags: [Products]
      summary: Full-text search (Typesense)
      description: Multi-match over name + description with fuzziness. 503 with errorCode `SERVICE_UNAVAILABLE` when search is disabled.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Matching product documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchEnvelope"
        "503":
          $ref: "#/components/responses/Error"
        "400":
          description: Empty query
          $ref: "#/components/responses/Error"

  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Product detail (Redis-cached)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Products]
      summary: Update product (owner only, publishes `product.updated`)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Products]
      summary: Delete product (owner or admin, publishes `product.deleted`)
      description: Owners delete their own products. Users with role `admin` can delete any product (RBAC).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List my orders
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderListEnvelope" }
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    post:
      tags: [Orders]
      summary: Create order (transactional outbox + stock hold)
      description: |
        Requires `Idempotency-Key`. Holds inventory and writes `order.created` to
        `outbox_events` in the same Postgres transaction. Kafka publish is async via outbox relay.
        `productId` must be a JSON number (not a string).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, qty]
                    properties:
                      productId: { type: integer, minimum: 1 }
                      qty: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Order created (pending_payment)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderEnvelope" }
        "400":
          description: Missing Idempotency-Key or invalid body
          $ref: "#/components/responses/Error"
        "404":
          description: Product not found
          $ref: "#/components/responses/Error"
        "409":
          description: Insufficient stock or idempotency key reused with different body (`RESOURCE_CONFLICT`)
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order detail
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderEnvelope" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order (releases held stock)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
        "409":
          description: Illegal state transition

  /api/v1/orders/{id}/pay:
    post:
      tags: [Orders]
      summary: Lab payment override (success|fail|timeout)
      description: |
        Teaching override. Canonical payment is the worker on `order.created`.
        Response `data` is `{ order, payment }` (camelCase).
        Default outcome=`success`; default key=`pay-{orderId}`.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [success, fail, timeout]
                key:
                  type: string
                  description: Payment attempt idempotency key
      responses:
        "200":
          description: Payment applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayResponse" }
        "400":
          description: Invalid outcome
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Illegal state transition
          $ref: "#/components/responses/Error"
        "503":
          description: Simulated timeout (`outcome=timeout`)

  /api/v1/orders/{id}/fulfill:
    post:
      tags: [Orders]
      summary: Mark paid order as fulfilled (admin only)
      description: Requires JWT role `admin`. Buyers receive 403.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Fulfilled
        "403":
          description: Caller is not admin
        "409":
          description: Illegal state transition

  /api/v1/wishlists:
    get:
      tags: [Wishlists]
      summary: List my wishlist items
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Wishlist rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistListEnvelope" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Wishlists]
      summary: Add product to wishlist
      description: `productId` must be a JSON number (not a string).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: integer, minimum: 1 }
                note: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistEnvelope" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Already wishlisted
          $ref: "#/components/responses/Error"

  /api/v1/wishlists/count:
    get:
      tags: [Wishlists]
      summary: Wishlist item count (Redis-cached)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistCountEnvelope" }

  /api/v1/wishlists/{id}:
    delete:
      tags: [Wishlists]
      summary: Remove wishlist row
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/lab/overview:
    get:
      tags: [Lab]
      summary: Dependency snapshot (admin, non-prod)
      description: All `/lab/*` routes require admin JWT and are omitted when `APP_ENV=production` (404).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Counts / ping summary
        "403":
          description: Not admin
        "404":
          description: Lab disabled in production

  /api/v1/lab/commerce/failure-matrix:
    get:
      tags: [Lab]
      summary: Expected behaviour per failure mode (static JSON)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Matrix rows

  /api/v1/lab/outbox/pending:
    get:
      tags: [Lab]
      summary: Unpublished outbox rows + paused flag
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Pending events (`pendingCount`, `paused`, `items`)

  /api/v1/lab/outbox/pause:
    post:
      tags: [Lab]
      summary: Pause outbox relay on this API pod (chaos)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Paused

  /api/v1/lab/outbox/resume:
    post:
      tags: [Lab]
      summary: Resume outbox relay
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Resumed

  /api/v1/lab/outbox/relay-once:
    post:
      tags: [Lab]
      summary: Force one publish cycle (works even while paused)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Cycle result

  /api/v1/lab/postgres/summary:
    get:
      tags: [Lab]
      summary: Table counts
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Summary

  /api/v1/lab/postgres/samples:
    get:
      tags: [Lab]
      summary: Sample products
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Samples

  /api/v1/lab/redis/product/{id}:
    get:
      tags: [Lab]
      summary: Peek product cache entry
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Hit/miss + TTL
    delete:
      tags: [Lab]
      summary: Invalidate product cache
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Invalidated

  /api/v1/lab/mongo/events:
    get:
      tags: [Lab]
      summary: Recent Mongo audit events
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Events

  /api/v1/lab/kafka/ping:
    post:
      tags: [Lab]
      summary: Publish lab.ping → worker → Mongo (admin, non-prod)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "201":
          description: Published
        "403":
          description: Not admin
        "404":
          description: Lab disabled in production

  /api/v1/lab/typesense:
    get:
      tags: [Lab]
      summary: Typesense stats + optional search
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Explore payload

  /api/v1/lab/typesense/reindex:
    post:
      tags: [Lab]
      summary: Rebuild Typesense from Postgres
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Reindexed

  /ws/products:
    get:
      tags: [Realtime]
      summary: WebSocket — real-time product event stream
      description: |
        Upgrade to WebSocket to receive product events from Kafka (notifier group).

        Query params (browsers cannot set custom headers on WS upgrade):
        - `token` — access JWT
        - `apikey` — same API key as REST (also accepted via `apikey` / `X-API-Key` header)

        Example: `ws://localhost:8080/ws/products?apikey=<key>&token=<accessToken>`
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: apikey
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols — event stream begins
        "401":
          description: Invalid token or missing apikey
        "426":
          description: Upgrade Required (non-WebSocket request)

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Also accepted as header `X-API-Key` (same value).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT from login/register/refresh.

  responses:
    Error:
      description: Error envelope with stable machine code
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "not found" }
        errorCode:
          type: string
          description: Stable machine code
          enum:
            - RESOURCE_NOT_FOUND
            - RESOURCE_CONFLICT
            - VALIDATION_ERROR
            - AUTH_EMAIL_TAKEN
            - AUTH_TOKEN_EXPIRED
            - AUTH_UNAUTHORIZED
            - AUTH_INVALID_API_KEY
            - AUTH_FORBIDDEN
            - RATE_LIMIT_EXCEEDED
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Andi }
        email: { type: string, format: email, example: andi@example.com }
        password: { type: string, minLength: 8, example: secret123 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [user, admin]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    AuthEnvelope:
      type: object
      description: Login / register success body (`data.tokens.*`)
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          required: [user, tokens]
          properties:
            user: { $ref: "#/components/schemas/User" }
            tokens: { $ref: "#/components/schemas/AuthTokens" }
      example:
        success: true
        message: login success
        data:
          user:
            id: 1
            name: Buyer Demo
            email: buyer@golang-be.dev
            role: user
          tokens:
            accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UserEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: "#/components/schemas/User" }

    Product:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        stock: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductCreateRequest:
      type: object
      required: [name, price]
      properties:
        name: { type: string, example: "Kopi Susu" }
        description: { type: string, example: "Iced" }
        price: { type: number, example: 28000 }
        stock: { type: integer, example: 10 }

    ProductUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        stock: { type: integer }

    ProductEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: "#/components/schemas/Product" }

    PageMeta:
      type: object
      properties:
        limit: { type: integer }
        nextCursor:
          type: integer
          description: Pass as `cursor` for the next page
        hasMore: { type: boolean }

    ProductListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        meta: { $ref: "#/components/schemas/PageMeta" }

    SearchEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: Typesense document id (string) }
              userId: { type: integer }
              name: { type: string }
              description: { type: string }
              price: { type: number }

    OrderItem:
      type: object
      properties:
        productId: { type: integer }
        qty: { type: integer }
        unitPrice: { type: number }

    Order:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        status:
          type: string
          enum: [pending_payment, paid, payment_failed, cancelled, fulfilled]
        total: { type: number }
        currency: { type: string, example: IDR }
        version: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: "#/components/schemas/Order" }

    OrderListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/Order" }

    Payment:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        idempotencyKey: { type: string }
        status: { type: string }
        amount: { type: number }
        providerRef: { type: string }
        attempt: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PayResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            order: { $ref: "#/components/schemas/Order" }
            payment: { $ref: "#/components/schemas/Payment" }

    WishlistItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        price: { type: number }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    WishlistEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: "#/components/schemas/WishlistItem" }

    WishlistListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/WishlistItem" }

    WishlistCountEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            count: { type: integer }
