version: "2"

linters:
  enable:
    - errcheck # unchecked errors
    - govet # standard vet suite
    - ineffassign # ineffective assignments
    - staticcheck # static analysis
    - unused # dead code
    - misspell # typos
    - revive # style guide
    - gosec # security patterns
    - gocritic # opinionated correctness checks
    - unconvert # unnecessary conversions
    - nilerr # returns nil right after err != nil
  settings:
    misspell:
      locale: US
    revive:
      rules:
        # Comment discipline lives in code review, not in the linter.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Tests may ignore errors and use weak crypto freely.
      - path: _test\.go
        linters: [errcheck, gosec]
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - third_party$
      - builtin$
      - examples$
